<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dash: Solo Jump</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #0ff; font-size: 28px; font-weight: bold;
            text-shadow: 0 0 10px #0ff; pointer-events: none;
        }
        #msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f; font-size: 32px; text-align: center;
            display: none; cursor: pointer; background: rgba(0,0,0,0.9);
            padding: 30px; border: 2px solid #f0f; box-shadow: 0 0 30px #f0f;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="msg">SYSTEM CRITICAL<br><span style="font-size:20px">Click to Reboot</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreEl = document.getElementById('score');
        const msgEl = document.getElementById('msg');

        let width, height, player, platforms, score, gameActive, gameSpeed, lastTime;
        
        const gravity = 0.9;      // Snappier fall
        const jumpForce = -16;    // Stronger single jump
        // maxJumps removed for single jump logic

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            score = 0;
            gameSpeed = 8; 
            gameActive = true;
            lastTime = performance.now();
            msgEl.style.display = 'none';
            scoreEl.innerText = "0";
            
            player = {
                x: 150, y: height / 2,
                w: 35, h: 35,
                vy: 0,
                onGround: false, // Track ground state for single jump
                glow: 0
            };

            platforms = [{ x: 0, y: height - 120, w: width * 0.8, h: 40 }];
            for(let i=0; i<6; i++) spawnPlatform();
            
            requestAnimationFrame(animate);
        }

        function spawnPlatform() {
            let last = platforms[platforms.length - 1];
            let newW = Math.random() * 120 + 120;
            let gap = Math.random() * 80 + 100; // Gaps reduced slightly for single jump safety
            let newX = last.x + last.w + gap;
            let newY = Math.max(250, Math.min(height - 150, last.y + (Math.random() * 200 - 100)));
            platforms.push({ x: newX, y: newY, w: newW, h: 40 });
        }

        function update(dt) {
            if (!gameActive) return;
            const speedMultiplier = dt / 16.67; 

            player.vy += gravity * speedMultiplier;
            player.y += player.vy * speedMultiplier;
            if (player.glow > 0) player.glow -= 2;

            let currentlyOnPlatform = false;

            for (let i = 0; i < platforms.length; i++) {
                let p = platforms[i];
                p.x -= gameSpeed * speedMultiplier;

                // Precision Collision
                if (player.x + player.w > p.x && 
                    player.x < p.x + p.w && 
                    player.y + player.h >= p.y && 
                    player.y + player.h <= p.y + player.vy + 12 && 
                    player.vy >= 0) {
                        player.vy = 0;
                        player.y = p.y - player.h;
                        currentlyOnPlatform = true;
                }
            }
            
            player.onGround = currentlyOnPlatform;

            if (platforms[0].x + platforms[0].w < 0) {
                platforms.shift();
                score++;
                scoreEl.innerText = score;
                gameSpeed += 0.22; 
                spawnPlatform();
            }

            if (player.y > height) {
                gameActive = false;
                msgEl.style.display = 'block';
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Platforms
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f0f';
            ctx.fillStyle = '#f0f';
            for (let p of platforms) {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            // Player
            ctx.shadowBlur = 15 + player.glow;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#0ff';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            
            ctx.fillStyle = '#000';
            ctx.shadowBlur = 0;
            ctx.fillRect(player.x + 20, player.y + 8, 8, 8);
        }

        function animate(now) {
            const dt = now - lastTime;
            lastTime = now;
            update(dt);
            draw();
            if (gameActive) requestAnimationFrame(animate);
        }

        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
            if (e.cancelable) e.preventDefault();
            
            if (!gameActive) {
                init();
            } else if (player.onGround) { // Only jump if currently touching a platform
                player.vy = jumpForce;
                player.onGround = false;
                player.glow = 30;
            }
        }

        window.addEventListener('mousedown', handleInput);
        window.addEventListener('keydown', handleInput);
        window.addEventListener('touchstart', handleInput, {passive: false});
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        init();
    </script>
</body>
</html>
