<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dash: Solid State</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #0ff; font-size: 28px; font-weight: bold;
            text-shadow: 0 0 10px #0ff; pointer-events: none;
        }
        #msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f; font-size: 32px; text-align: center;
            display: none; cursor: pointer; background: rgba(0,0,0,0.9);
            padding: 30px; border: 2px solid #f0f; box-shadow: 0 0 30px #f0f;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="msg">SYSTEM CRITICAL<br><span style="font-size:20px">Click to Reboot</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreEl = document.getElementById('score');
        const msgEl = document.getElementById('msg');

        let width, height, player, platforms, score, gameActive, gameSpeed, lastTime;
        
        const gravity = 1.0;      // Heavy gravity for high-speed control
        const jumpForce = -18;    // Powerful jump to compensate

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            score = 0;
            gameSpeed = 9; 
            gameActive = true;
            lastTime = performance.now();
            msgEl.style.display = 'none';
            scoreEl.innerText = "0";
            
            player = {
                x: 150, y: height / 2,
                w: 35, h: 35,
                vy: 0,
                onGround: false,
                glow: 0
            };

            // Initial safe zone
            platforms = [{ x: 0, y: height - 150, w: width * 0.8, h: 50 }];
            for(let i=0; i<6; i++) spawnPlatform();
            
            requestAnimationFrame(animate);
        }

        function spawnPlatform() {
            let last = platforms[platforms.length - 1];
            let newW = Math.random() * 150 + 100;
            let gap = Math.random() * 100 + 120; 
            let newX = last.x + last.w + gap;
            // Clamped Y range to prevent impossible jumps
            let newY = Math.max(height * 0.3, Math.min(height - 100, last.y + (Math.random() * 240 - 120)));
            platforms.push({ x: newX, y: newY, w: newW, h: 50 });
        }

        function update(dt) {
            if (!gameActive) return;
            const speedMultiplier = dt / 16.67; 

            // Apply Physics
            player.vy += gravity * speedMultiplier;
            let nextY = player.y + (player.vy * speedMultiplier);
            
            let landed = false;

            for (let i = 0; i < platforms.length; i++) {
                let p = platforms[i];
                p.x -= gameSpeed * speedMultiplier;

                // SOLID COLLISION LOGIC
                // Check horizontal bounds
                if (player.x + player.w > p.x && player.x < p.x + p.w) {
                    // Check if player's bottom is crossing the platform top
                    // We check current position vs next position to prevent tunneling
                    if (player.y + player.h <= p.y && nextY + player.h >= p.y) {
                        player.vy = 0;
                        nextY = p.y - player.h; // Snap to surface
                        landed = true;
                    }
                }
            }
            
            player.y = nextY;
            player.onGround = landed;
            if (player.glow > 0) player.glow -= 2;

            // Score and Cleanup
            if (platforms[0].x + platforms[0].w < 0) {
                platforms.shift();
                score++;
                scoreEl.innerText = score;
                gameSpeed += 0.25; 
                spawnPlatform();
            }

            // Death conditions
            if (player.y > height) {
                gameActive = false;
                msgEl.style.display = 'block';
            }
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw Platforms
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f0f';
            ctx.fillStyle = '#f0f';
            for (let p of platforms) {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Top highlight line for better visibility
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.x, p.y, p.w, 3);
                ctx.fillStyle = '#f0f';
            }

            // Draw Player
            ctx.shadowBlur = 20 + player.glow;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#0ff';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            
            // Eye
            ctx.fillStyle = '#000';
            ctx.shadowBlur = 0;
            ctx.fillRect(player.x + 20, player.y + 8, 8, 8);
        }

        function animate(now) {
            const dt = Math.min(now - lastTime, 32); // Cap dt to prevent massive jumps on lag
            lastTime = now;
            update(dt);
            draw();
            if (gameActive) requestAnimationFrame(animate);
        }

        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
            if (e.cancelable) e.preventDefault();
            
            if (!gameActive) {
                init();
            } else if (player.onGround) {
                player.vy = jumpForce;
                player.onGround = false;
                player.glow = 40;
            }
        }

        window.addEventListener('mousedown', handleInput);
        window.addEventListener('keydown', handleInput);
        window.addEventListener('touchstart', handleInput, {passive: false});
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        init();
    </script>
</body>
</html>
